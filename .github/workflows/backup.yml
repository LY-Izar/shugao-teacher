name: 数据库备份

***REMOVED*** Supabase 免费版**没有自动备份**。
***REMOVED*** 作业数据、成绩、错题记录一旦误删或被错误脚本清空，不可恢复 —— 这对学校是事故级风险。
***REMOVED*** 这个任务每晚把整个数据库 dump 出来，压缩后传到 Cloudflare R2，保留最近 30 份。

on:
  schedule:
    - cron: '30 18 * * *' ***REMOVED*** 每天 18:30 UTC（北京时间次日 02:30，避开白天）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 postgres 客户端
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::缺少 SUPABASE_DB_URL（控制台 Project Settings → Database → Connection string）"
            exit 1
          fi
          stamp=$(date -u +%Y%m%d-%H%M)
          ***REMOVED*** 只导 public schema 的数据与结构，够用于恢复
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            | gzip -9 > "backup-$stamp.sql.gz"
          ls -lh backup-*.sql.gz
          echo "FILE=backup-$stamp.sql.gz" >> "$GITHUB_ENV"

      - name: 上传到 Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }} ***REMOVED*** https://<account_id>.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::未配置 R2，改为把备份作为 Artifact 保留"
            exit 0
          fi
          aws s3 cp "$FILE" "s3://$R2_BUCKET/db-backups/$FILE" --endpoint-url "$R2_ENDPOINT"

      - name: 兜底：作为 Artifact 保留 30 天
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 30

      - name: 清理 R2 上超过 30 份的旧备份
        if: env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ***REMOVED*** 列出全部备份（按文件名倒序），删掉第 31 份之后的
          aws s3 ls "s3://$R2_BUCKET/db-backups/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | sort -r | tail -n +31 \
            | while read -r key; do
                [ -n "$key" ] && aws s3 rm "s3://$R2_BUCKET/db-backups/$key" --endpoint-url "$R2_ENDPOINT"
              done
          echo "清理完成"
