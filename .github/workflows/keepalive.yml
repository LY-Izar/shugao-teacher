name: Supabase 保活

***REMOVED*** Supabase 免费版项目「7 天不活跃会被自动暂停」。
***REMOVED*** 寒暑假或试用间歇期，教师一两周不用，回来就会发现系统打不开。
***REMOVED*** 这个任务每 3 天打一次接口，让它一直算「活跃」。

on:
  schedule:
    - cron: '0 1 */3 * *' ***REMOVED*** 每 3 天 01:00 UTC（北京时间 09:00）
  workflow_dispatch: ***REMOVED*** 也支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，请在仓库 Settings → Secrets 里配置"
            exit 1
          fi
          ***REMOVED*** 随便查一张表的 1 行，触发一次数据库活动
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/teachers?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::保活失败（HTTP $code）——项目可能已经被暂停，去控制台手动恢复"
            exit 1
          fi
          echo "保活成功"
