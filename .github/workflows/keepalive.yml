name: Supabase 保活

***REMOVED*** Supabase 免费版项目「7 天不活跃会被自动暂停」。
***REMOVED*** 寒暑假或试用间歇期，教师一两周不用，回来就会发现系统打不开。
***REMOVED*** 这个任务每 3 天打一次接口，让它一直算「活跃」。
***REMOVED***
***REMOVED*** 注意：这里刻意**不去查业务表**。
***REMOVED*** 我们关掉了「Automatically expose new tables」并收紧了授权，
***REMOVED*** anon 角色读 teachers 表会直接报权限错误 —— 那是预期行为，不是故障。
***REMOVED*** 所以改成打 Auth 健康检查与 REST 根路径，这两个都不需要任何表权限。

on:
  schedule:
    - cron: '0 1 */3 * *' ***REMOVED*** 每 3 天 01:00 UTC（北京时间 09:00）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，请在仓库 Settings → Secrets 里配置"
            exit 1
          fi

          fail=0
          for spec in "Auth 健康检查 /auth/v1/health" "REST 根路径 /rest/v1/"; do
            label="${spec%% *}"
            path="${spec***REMOVED**** }"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --max-time 20 "$SUPABASE_URL$path" || echo "000")
            echo "$label → HTTP $code"
            ***REMOVED*** 2xx / 401 / 403 都说明接口有响应、项目还活着
            case "$code" in
              2*|401|403) ;;
              *) fail=1 ;;
            esac
          done

          if [ "$fail" != "0" ]; then
            echo "::error::保活失败 —— 项目可能已被暂停，去控制台手动 Restore"
            exit 1
          fi
          echo "保活成功"
